repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }

    // Renderer compile dependencies (place the development or release jars in libs/).
    // Celeritas and Actinium expose the same option model under different package names, so both
    // jars can sit on the compile classpath at once; each renderer adapter in
    // jp.s12kuma01.actiniumextra.renderer binds to one of them and is only loaded at runtime when
    // its renderer is installed. Neither jar is bundled or forced onto the runtime classpath.
    // For integration testing, put a runnable/remapped renderer jar in run/client/mods instead;
    // which renderer is in that directory is what selects the adapter at runtime.
    fileTree(dir: 'libs', include: ['*.jar']).each { jar ->
        modCompileOnly files(jar)
    }

    // Actinium support is compiled into every artifact, so its jar is not optional at build time.
    // Fetch it with:
    //   curl -L -o libs/actinium-${actinium_api_version}.jar \
    //     https://github.com/DHJComical/Actinium/releases/download/${actinium_api_version}/Actinium-${actinium_api_version}.jar
    if (fileTree(dir: 'libs', include: ['actinium-*.jar']).isEmpty()) {
        throw new GradleException("No Actinium jar found in libs/. Actinium Extra compiles an Actinium " +
                "renderer adapter into every build, so download Actinium ${actinium_api_version} (see README) " +
                "into libs/ and build again.")
    }

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // contain = bundle dependency jars into final artifact, will extract them in mod loading. Can be used as jar-in-jar
    // shadow = bundle dependencies into shadow output artifact (relocation configurable in shadowJar task)
    // modImplementation = mod dependency available at both compile time and runtime
    // modCompileOnly = mod dependency available only at compile time
    // modLibrary = won't be remapped but will be force-injected into the classpath later

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}
