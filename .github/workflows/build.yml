name: Build mod jar

# Branch pushes and pull requests only: a tag push already builds the jars through Releases, and
# running both just doubles the CI minutes and clutters the Actions list with duplicate runs.
# Pull requests are built so an upstream-sync merge cannot land broken.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.1.0
        name: Set up Gradle
      - name: Add permission
        run: chmod +x ./gradlew
      - name: Check fork identity
        run: bash .github/scripts/check-fork-identity.sh
      - name: Download Actinium renderer API jar
        run: |
          version=$(grep -m1 '^actinium_api_version *=' gradle.properties | cut -d= -f2 | tr -d ' ')
          curl -sfL -o "libs/actinium-${version}.jar" \
            "https://github.com/DHJComical/Actinium/releases/download/${version}/Actinium-${version}.jar"
      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload build jars
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-libs
          path: build/libs
          retention-days: 14
