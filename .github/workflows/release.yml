name: Releases

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.1.0
        name: Set up Gradle
      - name: Add permission
        run: chmod +x ./gradlew
      - name: Download Actinium renderer API jar
        run: |
          version=$(grep -m1 '^actinium_api_version *=' gradle.properties | cut -d= -f2 | tr -d ' ')
          curl -sfL -o "libs/actinium-${version}.jar" \
            "https://github.com/DHJComical/Actinium/releases/download/${version}/Actinium-${version}.jar"
      - name: Execute Gradle build
        run: ./gradlew build

      # The -dev jar is a Cleanroom development artifact for runClient setups; publishing it only
      # gives players a file that cannot be installed. build.yml still keeps it as a CI artifact.
      - name: Drop the development jar from the release assets
        run: rm -fv build/libs/*-dev.jar

      - uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "build/libs/*"
          generateReleaseNotes: true
